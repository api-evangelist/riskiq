name: RiskIQ
description: >-
  RiskIQ was a San Francisco-based external threat intelligence and attack
  surface management company, known for its PassiveTotal platform (passive DNS,
  WHOIS, SSL certificate and host-pair intelligence), Digital Footprint external
  asset discovery, and External Threats brand/phishing detection. It exposed a
  developer REST API at api.riskiq.net and a research console at
  community.riskiq.com. Microsoft acquired RiskIQ in 2021 and folded its
  technology into Microsoft Defender Threat Intelligence (MDTI) and Microsoft
  Defender External Attack Surface Management (Defender EASM). As of this
  enrichment pass the riskiq.com domain runs on Microsoft/Azure infrastructure
  and www.riskiq.com issues a 301 redirect to the Microsoft Defender Threat
  Intelligence product page; the standalone RiskIQ/PassiveTotal API hosts
  (api.riskiq.net, community.riskiq.com) no longer accept connections. This
  profile is retained as a historical/acquired-company record with no live,
  independent API surface to enrich.
